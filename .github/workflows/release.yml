name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux-release.yml

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/gh-assigned
          [[ "${{ matrix.asset }}" == *.exe ]] && bin="$bin.exe"
          cp "$bin" "gh-assigned-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gh-assigned-${{ matrix.asset }}
          path: gh-assigned-${{ matrix.asset }}

  release:
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
